<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <pre id="status">starting</pre>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const status = document.getElementById('status');
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);

      const pmrem = new THREE.PMREMGenerator(renderer);
      const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      const gltf = await new GLTFLoader().loadAsync('/models/statue.glb');
      const root = gltf.scene;
      const scene = new THREE.Scene();
      scene.environment = env;
      const material = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0.035, 0.05, 0.09),
        metalness: 1,
        roughness: 0.12,
        iridescence: 0.35,
        iridescenceIOR: 1.4,
        iridescenceThicknessRange: [200, 700],
        envMapIntensity: 1.25,
      });
      root.traverse((obj) => {
        if (obj.isMesh) obj.material = material;
      });
      scene.add(root);

      root.updateWorldMatrix(true, true);
      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const dist = Math.max(size.x, size.y, size.z) * 4;
      const phi = THREE.MathUtils.degToRad(84);
      const theta = THREE.MathUtils.degToRad(90);
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, dist / 100, dist * 10);
      camera.position.set(
        center.x + dist * Math.sin(phi) * Math.cos(theta),
        center.y + dist * Math.cos(phi),
        center.z + dist * Math.sin(phi) * Math.sin(theta),
      );
      camera.up.set(0, 1, 0);
      camera.lookAt(center);
      camera.updateMatrixWorld();

      const warm = new THREE.DirectionalLight(0xff4a12, 7);
      warm.position.set(center.x - size.x * 1.4, center.y + size.y * 0.15, center.z + size.z * 1.6);
      const cyan = new THREE.DirectionalLight(0x22e6ff, 2.4);
      cyan.position.set(center.x + size.x, center.y + size.y * 0.8, center.z - size.z * 1.2);
      const mag = new THREE.DirectionalLight(0xff2ad4, 3.2);
      mag.position.set(center.x - size.x * 0.2, center.y + size.y * 1.3, center.z - size.z);
      const gold = new THREE.DirectionalLight(0xffc14a, 1.6);
      gold.position.set(center.x + size.x * 0.8, center.y - size.y * 0.2, center.z + size.z);
      scene.add(warm, cyan, mag, gold);

      const inv = camera.matrixWorldInverse;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      const corners = [
        [box.min.x, box.min.y, box.min.z],
        [box.min.x, box.min.y, box.max.z],
        [box.min.x, box.max.y, box.min.z],
        [box.min.x, box.max.y, box.max.z],
        [box.max.x, box.min.y, box.min.z],
        [box.max.x, box.min.y, box.max.z],
        [box.max.x, box.max.y, box.min.z],
        [box.max.x, box.max.y, box.max.z],
      ];
      for (const [x, y, z] of corners) {
        const point = new THREE.Vector3(x, y, z).applyMatrix4(inv);
        minX = Math.min(minX, point.x);
        maxX = Math.max(maxX, point.x);
        minY = Math.min(minY, point.y);
        maxY = Math.max(maxY, point.y);
      }
      const pad = 1.04;
      const width = (maxX - minX) * pad;
      const height = (maxY - minY) * pad;
      const aspect = width / height;
      const longSide = 1800;
      const pixels = aspect >= 1
        ? { w: longSide, h: Math.max(2, Math.round(longSide / aspect)) }
        : { w: Math.max(2, Math.round(longSide * aspect)), h: longSide };
      renderer.setSize(pixels.w, pixels.h, false);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      camera.left = cx - width / 2;
      camera.right = cx + width / 2;
      camera.top = cy + height / 2;
      camera.bottom = cy - height / 2;
      camera.updateProjectionMatrix();
      renderer.setClearColor(0x000000, 0);
      renderer.clear();
      renderer.render(scene, camera);
      const blob = await new Promise((resolve) => renderer.domElement.toBlob(resolve, 'image/png'));
      await fetch('http://127.0.0.1:4456/statue-face2', { method: 'POST', body: blob });
      status.textContent = `saved ${pixels.w}x${pixels.h} ${blob.size}`;
    </script>
  </body>
</html>
